services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: psst
      POSTGRES_USER: psst
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - psst_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psst -d psst"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/psst
      DB_USER: psst
      DB_SCHEMA: public
      COOKIE_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy

volumes:
  psst_data:
